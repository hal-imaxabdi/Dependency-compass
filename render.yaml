# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: dependency-compass
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process: the rate limiter and caches live in memory.
    # --no-proxy-headers: our own code decides which forwarded IP to trust.
    startCommand: >-
      uvicorn --factory dependency_compass.api:app_from_env
      --host 0.0.0.0 --port $PORT
      --no-proxy-headers --no-server-header --limit-concurrency 32
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Measured X-Forwarded-For on Render: "<client>, <cloudflare>, <internal>"
      # -> the client is the 3rd entry from the right. See api.py.
      - key: DC_PROXY_HOPS
        value: "3"
      - key: DC_LOG_FORWARDED
        value: "0"   # set to "1" to re-check the header if Render changes
